name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: step-security/setup-zig@v2
        with:
          version: latest
      - name: Set SDKROOT
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null) || SDK="/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
          echo "SDKROOT=$SDK" >> $GITHUB_ENV
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: step-security/setup-zig@v2
        with:
          version: latest
      - name: Install webkit2gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Linux binaries
        run: |
          cd apps/desktop
          zig build -Dtarget=x86_64-linux-gnu.2.31 -Doptimize=ReleaseSafe --prefix zig-out/x86_64-linux-gnu
          zig build -Dtarget=aarch64-linux-gnu.2.31 -Doptimize=ReleaseSafe --prefix zig-out/aarch64-linux-gnu
      - name: Upload to release
        run: |
          gh release upload ${{ github.ref_name }} apps/desktop/zig-out/*/bin/tinycord --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
