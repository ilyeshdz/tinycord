name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: step-security/setup-zig@v2
        with:
          version: latest
      - name: Set SDKROOT
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null) || SDK="/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
          echo "SDKROOT=$SDK" >> $GITHUB_ENV
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create macOS DMG
        run: apps/desktop/scripts/make-dmg.sh
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Upload installers to release
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.dmg --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
