[package]
name = "tinycord"
version = "0.0.0"
description = "A lightweight Discord client"
authors = ["Tinycord contributors"]
edition = "2021"

[lib]
name = "tinycord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
